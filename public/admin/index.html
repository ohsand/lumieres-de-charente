<!doctype html>
<html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" /><title>Lumières de Charente – Admin</title></head>
<body>
<script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
<script>
  // Login uses a password, not a GitHub account: relabel Decap's login button.
  new MutationObserver(function () {
    document.querySelectorAll('button').forEach(function (b) {
      if (/GitHub/.test(b.textContent)) b.textContent = 'Se connecter / Log in';
    });
  }).observe(document.body, { childList: true, subtree: true });
</script>
</body></html>
